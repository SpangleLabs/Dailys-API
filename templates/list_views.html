{% extends 'base.html' %}

{% block title %}List of views{% endblock %}

{% block body %}
<ul>
    {% for view_entry in view_entries %}
        {% if view_entry.include_in_list() %}
        <li>
            <a href="{{ view_entry.full_path() }}">{{ view_entry.display_text() }}</a>
        </li>
        {% endif %}
    {% endfor %}
</ul>
{% endblock %}
